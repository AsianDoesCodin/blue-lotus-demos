<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Workbench — Projects</title>
  <meta name="description" content="Demo web app by Blue Lotus Coding: Workbench, a fictional project management tool with boards, tasks, files and settings.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2318181b'/%3E%3Crect x='14' y='16' width='10' height='32' rx='2' fill='%23fafafa'/%3E%3Crect x='27' y='26' width='10' height='22' rx='2' fill='%23fafafa' opacity='.8'/%3E%3Crect x='40' y='34' width='10' height='14' rx='2' fill='%23a78bfa'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#fafafa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="../shared/kit.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button class="skip" data-action="skip-to-content">Skip to content</button>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Workspace">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">Workbench</span>
        <button class="sidebar-close icon-btn" data-action="sidebar-close" aria-label="Close menu">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="workspace"><span class="ws-logo" aria-hidden="true">F</span><span><strong>Fieldnote Studio</strong><small>Team workspace</small></span></div>
      <button class="new-task" data-action="new-task">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New task<kbd>N</kbd>
      </button>
      <nav class="side-nav" aria-label="Main">
        <a href="#/" data-nav="/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg>Overview</a>
        <a href="#/projects" data-nav="/projects"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h5v14H4zM10 5h5v9h-5zM16 5h4v6h-4z"/></svg>Projects</a>
        <a href="#/tasks" data-nav="/tasks"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tasks</a>
        <a href="#/files" data-nav="/files"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>Files</a>
        <a href="#/settings" data-nav="/settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
      </nav>
      <div class="side-projects">
        <p class="side-label">Projects</p>
        <div id="side-projects"></div>
      </div>
      <div class="side-user" id="side-user"></div>
    </aside>
    <div class="scrim" data-action="sidebar-close" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="sidebar-open" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <form class="search" data-form="search" role="search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <label class="visually-hidden" for="global-search">Search tasks</label>
          <input id="global-search" name="q" type="search" placeholder="Search tasks" autocomplete="off">
          <kbd>/</kbd>
        </form>
        <div class="top-actions">
          <button class="icon-btn" data-action="theme-toggle" aria-label="Switch to dark mode" id="theme-toggle">
            <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <div class="notify">
            <button class="icon-btn" data-action="notifications" aria-label="Notifications" aria-expanded="false" aria-controls="notify-panel" id="notify-btn">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"/></svg>
              <span class="notify-dot" id="notify-dot"></span>
            </button>
            <div class="notify-panel" id="notify-panel" hidden></div>
          </div>
          <a class="me" href="#/settings" aria-label="Your profile" id="me-avatar"></a>
        </div>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>

  <script src="../shared/kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
